<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">FRAMLI-MOTION · 动效预览与贝塞尔调试工作台</title>
  <desc id="hero-desc">左侧是项目名、一句话说明与导出能力；右侧还原工作台里的贝塞尔缓动曲线编辑器与时长滑杆。</desc>

  <defs>
    <g id="tick-strip">
      <rect x="0" y="0" width="2" height="9" fill="#cdff39"/>
      <rect x="14" y="0" width="2" height="6" fill="#2b3342"/>
      <rect x="28" y="0" width="2" height="6" fill="#2b3342"/>
      <rect x="42" y="0" width="2" height="6" fill="#2b3342"/>
      <rect x="56" y="0" width="2" height="9" fill="#cdff39"/>
      <rect x="70" y="0" width="2" height="6" fill="#2b3342"/>
      <rect x="84" y="0" width="2" height="6" fill="#2b3342"/>
      <rect x="98" y="0" width="2" height="6" fill="#2b3342"/>
      <rect x="112" y="0" width="2" height="9" fill="#cdff39"/>
      <rect x="126" y="0" width="2" height="6" fill="#2b3342"/>
      <rect x="140" y="0" width="2" height="6" fill="#2b3342"/>
      <rect x="154" y="0" width="2" height="6" fill="#2b3342"/>
    </g>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="380" rx="26" fill="#090b10"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="none" stroke="#232b3b"/>

  <!-- Structural rules + repeatable timeline-tick motif -->
  <g id="frame-rules">
    <use href="#tick-strip" x="56" y="34"/>
    <path d="M56 54 H1144" stroke="#1b2230"/>
    <path d="M688 74 V324" stroke="#1c2330"/>
    <use href="#tick-strip" x="56" y="348"/>
  </g>

  <!-- Left: project identity -->
  <g id="title-block">
    <text x="56" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7f8aa0">MOTION WORKBENCH  /  动效预览与贝塞尔调试工作台</text>
    <text x="56" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="64" font-weight="700" letter-spacing="-2" fill="#f2f5fb">FRAMLI<tspan fill="#cdff39">-MOTION</tspan></text>
    <text x="56" y="216" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Segoe UI, sans-serif" font-size="27" fill="#d8deea">346 个动效预设，拖曲线、听声效、导出代码</text>
    <text x="56" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#7f8aa0">CSS Keyframes · Motion (React) · GSAP 3 · AI Prompt</text>
  </g>

  <!-- Left: repository metadata chips (animated layer) -->
  <g id="export-chips">
    <rect x="56" y="284" width="152" height="36" rx="9" fill="#151b25" stroke="#2a3444"/>
    <text x="132" y="308" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#cdff39">346 PRESETS</text>
    <rect x="218" y="284" width="100" height="36" rx="9" fill="#151b25" stroke="#2a3444"/>
    <text x="268" y="308" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#aab3c5">13 SFX</text>
    <rect x="328" y="284" width="124" height="36" rx="9" fill="#151b25" stroke="#2a3444"/>
    <text x="390" y="308" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#aab3c5">4 THEMES</text>
    <rect x="462" y="284" width="124" height="36" rx="9" fill="#151b25" stroke="#2a3444"/>
    <text x="524" y="308" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#aab3c5">3 RATIOS</text>
  </g>

  <!-- Right: the real easing inspector, simplified -->
  <g id="inspector-card">
    <rect x="712" y="44" width="432" height="292" rx="18" fill="#10141d" stroke="#242c3c"/>
    <text x="736" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b94a8">EASING CURVE / 缓动曲线</text>
    <rect x="1044" y="58" width="76" height="28" rx="7" fill="#1c2612" stroke="#4a5a1c"/>
    <text x="1082" y="78" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#cdff39">2.4s</text>

    <rect x="736" y="96" width="384" height="144" rx="10" fill="#0b0e15" stroke="#1d2532"/>
    <path d="M832 96 V240 M928 96 V240 M1024 96 V240 M736 132 H1120 M736 168 H1120 M736 204 H1120" stroke="#1b2230"/>
    <text x="736" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7f8aa0">cubic-bezier(0.25, 0.46, 0.45, 0.94)</text>

    <rect x="736" y="298" width="384" height="6" rx="3" fill="#232b3a"/>
    <text x="736" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#667085">0.2s</text>
    <text x="882" y="328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#cdff39">2.4s</text>
    <text x="1120" y="328" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#667085">6.0s</text>
  </g>

  <!-- Curve geometry (animated reveal) -->
  <g id="curve-geometry">
    <path d="M752 228 L840 173 M1104 108 L910 115" stroke="#3c4759" stroke-dasharray="5 6" fill="none"/>
    <path d="M752 228 C840 173 910 115 1104 108" stroke="#cdff39" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="752" cy="228" r="5" fill="#4d5668"/>
    <circle cx="1104" cy="108" r="5" fill="#4d5668"/>
    <circle cx="840" cy="173" r="9" fill="#cdff39"/>
    <circle cx="910" cy="115" r="9" fill="#5ad2ff"/>
  </g>

  <!-- Duration value (animated layer) -->
  <g id="duration-fill">
    <rect x="736" y="298" width="146" height="6" rx="3" fill="#cdff39"/>
    <circle cx="882" cy="301" r="9" fill="#cdff39"/>
  </g>
</svg>
